# /etc/nginx/sites-available/netmon.click
# Proxy NETMON on a shared VPS where another app already owns :80/:443.
# Upstream is docker compose web published as WEB_HOST_PORT (default 3008).

upstream netmon_web {
    server 127.0.0.1:3008;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name netmon.click www.netmon.click *.netmon.click;

    client_max_body_size 25m;

    location / {
        proxy_pass http://netmon_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
